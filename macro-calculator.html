  Paste this entire block into a GoHighLevel "Custom JS/HTML" element.

  Self-contained: no build step, no hosted files, no external JavaScript.
  The only outside request is the Archivo webfont from Google Fonts.

  into the calculator and the calculator's CSS cannot leak onto your page.

<!-- the host element itself sits in your page's DOM, so it gets its own armour -->
<style>
  #starfighter-macros{
    /* all:initial strips whatever the page builder puts on this element.
       It also resets font-family to the browser default, and a document-level
       rule outranks the shadow root's own :host rule -- so the family has to
       be restated right here or everything inside renders in Times. */
    all:initial !important;
    display:block !important;
    width:100% !important;
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif !important;
    color:#10182B !important;

<script>

(function(){
  "use strict";

  var ROOT = null;
  var SFM_CSS = `
  /* ============================================================
     Starfighter Fitness — navy / off-white / red, Archivo.
     Light = off-white ground. Dark = navy ground. Red stays scarce.
     ============================================================ */
  :host{
    /* sampled from starfighterfitness.com: navy #10182B, off-white #F6F5F2,
       red #E63946, muted #6E7480. --red is the site red, for navy grounds;
       --red-ink is a darkened version that stays legible on off-white. */
    --ground:#F6F5F2;
    --panel:#FFFFFF;
    --panel-2:#ECEAE5;
    --navy:#10182B;
    --ink:#10182B;
    --ink-2:#3A4257;
    --muted:#6E7480;
    --line:#D5D2CA;
    --line-2:#E5E2DB;
    --red:#E63946;
    --red-ink:#E63946;
    --sel:#10182B;
    --sel-ink:#F6F5F2;
    --sel-line:#10182B;
    --inv-ground:#10182B;
    --inv-ink:#F6F5F2;
    --inv-muted:#8A93A6;
    --inv-line:#232D45;
    --pro:#E63946;
    --fat:#2B3A5E;
    --carb:#9A9284;
    --alert-bg:#FBE9EA;

  *{box-sizing:border-box}
  /* author styles beat the UA rule for [hidden], so restate it explicitly:

  [hidden]{display:none !important}

  /* ---------- typographic utilities ---------- */
  .eyebrow{
    font-size:10.5px;

  }
  .cap{

    letter-spacing:.15em;

  }

  /* ---------- site bar, matching starfighterfitness.com ---------- */
  .site-bar{
    background:var(--navy);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:14px 20px;padding-block:16px;
  }
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none}
  .brand-mark{
    width:19px;height:19px;flex:0 0 auto;background:var(--red);
    clip-path:polygon(26% 0,100% 0,74% 100%,0 100%);

    content:"";position:absolute;left:38%;top:14%;width:2px;height:72%;
    background:#F6F5F2;transform:skewX(-14deg);
  }
  .brand-name{

  }
  .bar-cta{
    display:inline-block;text-decoration:none;
    background:var(--red);color:#FFFFFF;border:0;
    font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
    padding:11px 17px;transition:opacity .1s linear;
  }
  .bar-cta:hover{opacity:.87}

  /* ---------- title block ---------- */
  header.top{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px 24px;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:6px;
  }
  h1{
    font-weight:900;
    font-size:clamp(32px,6.2cqw,60px);
    line-height:.86;
    letter-spacing:-.035em;
    text-transform:uppercase;
    margin:6px 0 0;
    text-wrap:balance;
  }
  .rule-red{height:4px;background:var(--red);width:96px;margin-bottom:16px}
  .tagline{
    color:var(--ink-2);
    font-size:14px;
    max-width:62ch;
    margin:0 0 26px;
  }

  /* ---------- segmented control ---------- */
  .seg{display:inline-flex;border:1.5px solid var(--ink);background:var(--panel)}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--ink);
    font-family:inherit;font-size:10.5px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;
    padding:8px 13px;cursor:pointer;

  .seg button + button{border-left:1.5px solid var(--ink)}
  .seg button:hover{background:var(--panel-2)}
  .seg button[aria-checked="true"]{background:var(--sel);color:var(--sel-ink)}

    margin-bottom:14px;padding-bottom:9px;border-bottom:1.5px solid var(--ink);
  }
  .step-num{font-size:11px;font-weight:900;color:var(--red-ink);letter-spacing:.08em}
  .step-title{
    font-weight:900;font-size:18px;text-transform:uppercase;
    letter-spacing:-.012em;margin:0;flex:1;line-height:1.1;
  }
  .step-note{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  /* ---------- inputs ---------- */
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:13px}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  input[type="number"]{
    width:100%;font-family:inherit;font-variant-numeric:tabular-nums;
    font-size:18px;font-weight:700;color:var(--ink);
    background:var(--ground);border:1.5px solid var(--line);border-radius:0;
    padding:8px 10px;

  input[type="number"]::-webkit-inner-spin-button{opacity:.3}
  .ht-pair{display:flex;gap:8px}

  .seed-note{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:11px 0 0}

  /* ---------- option cards ---------- */

  .opts.fat .opt{flex:1 1 132px}
  .opt{
    appearance:none;text-align:left;font-family:inherit;color:var(--ink);
    background:var(--ground);border:1.5px solid var(--line);border-radius:0;
    padding:9px 10px 8px;cursor:pointer;

  }
  .opt:hover{border-color:var(--ink)}
  .opt .o-label{font-weight:800;font-size:14.5px;letter-spacing:-.012em;text-transform:uppercase;line-height:1.15}
  .opt .o-sub{font-size:11px;font-weight:500;color:var(--muted);line-height:1.25}
  .opt .o-out{
    font-size:12px;font-weight:700;color:var(--ink-2);
    margin-top:4px;padding-top:5px;border-top:1.5px solid var(--line-2);
    font-variant-numeric:tabular-nums;
  }
  .opt[aria-checked="true"]{background:var(--sel);border-color:var(--sel-line);color:var(--sel-ink)}
  .opt[aria-checked="true"] .o-sub,
  .opt[aria-checked="true"] .o-out{color:var(--sel-ink);opacity:.72}
  .opt[aria-checked="true"] .o-out{border-top-color:currentColor;opacity:.72}

  /* ---------- readout ---------- */
  .readout{border:1.5px solid var(--ink);background:var(--panel)}
  .ro-head{background:var(--inv-ground);color:var(--inv-ink);padding:16px 17px 15px}
  .ro-kcal{
    font-weight:900;font-size:64px;line-height:.84;letter-spacing:-.045em;
    display:block;font-variant-numeric:tabular-nums;
  }
  .ro-kcal-unit{
    font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
    color:var(--inv-muted);margin-top:9px;
  }
  .ro-head .bar-red{height:3px;background:var(--red);width:64px;margin-top:12px}

  .chain{display:flex;flex-direction:column;border-bottom:1.5px solid var(--ink)}
  .chain-row{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:7px 17px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .chain-row + .chain-row{border-top:1px solid var(--line-2)}
  .chain-row .k{color:var(--muted);letter-spacing:.11em;text-transform:uppercase;font-size:10px;font-weight:700}
  .chain-row .v{font-weight:700}
  .chain-row.accent .v{color:var(--red-ink)}

  .bar{display:flex;height:14px;margin:15px 17px 7px;background:var(--panel-2)}
  .bar span{display:block;height:100%}

  .macros{display:flex;flex-direction:column;padding:0 17px 3px}
  .macro{
    display:grid;grid-template-columns:12px 1fr auto;
    align-items:baseline;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line-2);
  }
  .macro:last-child{border-bottom:0}
  .swatch{width:11px;height:11px;align-self:center}
  .m-name{font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
  .m-name small{
    display:block;font-size:10px;font-weight:600;letter-spacing:.07em;
    color:var(--muted);text-transform:uppercase;margin-top:3px;
  }
  .m-right{text-align:right}
  .m-g{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block}
  .m-g em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
  .m-kcal{font-size:10.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em;display:block;margin-top:2px}

  .alert{
    display:none;margin:0 17px 15px;padding:10px 11px;
    background:var(--alert-bg);border:1.5px solid var(--alert-line);border-left:4px solid var(--red);
    font-size:12.5px;line-height:1.4;color:var(--ink);
  }
  .alert.on{display:block}
  .alert strong{
    font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--red-ink);display:block;margin-bottom:4px;
  }

  /* ---------- arithmetic + notes ---------- */
  section.math,section.notes{
    margin-top:20px;background:var(--panel);border:1.5px solid var(--ink);padding:18px 18px 20px;
  }
  section.math h2,section.notes h2{

  .foot-brand p{

  .foot-h{

  .foot-col a{color:#D6DBE5;text-decoration:none;font-size:13.5px;font-weight:400}
  .foot-col a:hover{color:#FFFFFF;text-decoration:underline}
  .foot-legal{

    border-top:1px solid #222C44;padding-top:18px;max-width:96ch;
  }
  .foot-bar{
    display:flex;flex-wrap:wrap;gap:8px 34px;margin-top:20px;padding-top:16px;
    border-top:1px solid #222C44;
    color:#5F6879;font-size:9.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
  }

  /* ---------- save ---------- */
  .save-wrap{padding:0 17px 16px}
  .save-btn{
    width:100%;appearance:none;font-family:inherit;cursor:pointer;
    background:var(--sel);color:var(--sel-ink);border:1.5px solid var(--sel-line);border-radius:0;
    font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
    padding:12px 10px;transition:opacity .1s linear;
  }
  .save-btn:hover{opacity:.86}
  .save-btn[disabled]{cursor:default;opacity:.55}
  .save-note{
    font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);
    margin:8px 0 0;text-align:center;
  }
  .save-note.warn{color:var(--red-ink)}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}

  /* ---------- call to action ---------- */
  section.cta{
    margin-top:20px;background:var(--inv-ground);color:var(--inv-ink);
    border:1.5px solid var(--ink);padding:22px 20px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 26px;
  }
  section.cta .cta-txt{flex:1 1 380px;min-width:0}
  section.cta .cta-eyebrow{
    font-size:9.5px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;
    color:var(--inv-muted);margin-bottom:9px;
  }
  section.cta h2{
    font-weight:900;font-size:26px;text-transform:uppercase;
    letter-spacing:-.025em;line-height:1;margin:0;color:var(--inv-ink);
  }
  section.cta .cta-copy{
    font-size:13.5px;font-weight:500;color:var(--inv-muted);
    max-width:58ch;margin-top:11px;line-height:1.55;
  }
  .cta-btn{
    display:inline-block;text-decoration:none;flex:0 0 auto;
    background:var(--red);color:#F4F2ED;border:1.5px solid var(--red);
    font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
    padding:14px 22px;transition:opacity .1s linear;
  }
  .cta-btn:hover{opacity:.87}
  .cta-btn:focus-visible{outline:2px solid var(--inv-ink);outline-offset:3px}

  /* The page builder puts this in a fixed-width column. Break out of it so
     the navy bars span the window; the content column stays capped. */
  .wrap{
    /* width:auto is load-bearing: with a fixed width the negative margins
       only shift the box, they do not widen it. */
    width:auto;
    max-width:none;
    margin-left:var(--sfm-bleed-l, 0px);
    margin-right:var(--sfm-bleed-r, 0px);
  }

  /* container queries drive the layout; this covers browsers without them */
  @supports not (container-type: inline-size){
    @media (min-width:1180px){
      .grid{grid-template-columns:minmax(0,1fr) minmax(0,384px);gap:26px}
      .readout-col{position:sticky;top:20px}
      section.notes ul{column-count:2;column-gap:36px}
    }
  }
`;

      <li><b>3,500 kcal per pound</b> is a rule of thumb that drifts over long timelines, because expenditure falls as bodyweight falls and rises as it rises. Recalculate every 10&ndash;15 lb in either direction.</li>
      <li><b>Protein by total bodyweight</b> runs high at higher body-fat percentages. At 1.0 g/lb, lean body mass is the better denominator when a DEXA or InBody number exists.</li>

  function compute(pplOverride, rateOverride, actOverride, fatOverride){

    wireNumber("lb",   function(v){ S.weightLb = clamp(v, 60, 600, S.weightLb); });
    wireNumber("kg",   function(v){ S.weightLb = clamp(v, 30, 275, S.weightLb/LB_PER_KG) * LB_PER_KG; });
    wireNumber("ft",   function(v){ S.heightIn = clamp(v,3,7,Math.floor(S.heightIn/12))*12 + (S.heightIn % 12); });
    wireNumber("inch", function(v){ S.heightIn = Math.floor(S.heightIn/12)*12 + clamp(v,0,11.9,S.heightIn%12); });
    wireNumber("cm",   function(v){ S.heightIn = clamp(v,120,230, S.heightIn*2.54) / 2.54; });

    wireSave();
    loadLocal();
    syncInputs();
    render();
    loadRemote();
    loadDownloads();
  }

  /* ---------- PDF export (hand-built, no library) ---------- */
  var NAVY=[0.063,0.094,0.169], RED=[0.902,0.224,0.275], PAPER=[0.965,0.961,0.949],
      GREY=[0.431,0.455,0.502], HAIR=[0.835,0.824,0.792],
      C_PRO=[0.902,0.224,0.275], C_FAT=[0.169,0.227,0.369], C_CARB=[0.604,0.573,0.518];

  function ascii(v){
    return String(v)
      .replace(/[–—−]/g,"-").replace(/×/g,"x").replace(/÷/g,"/")
      .replace(/·/g,"-").replace(/≈/g,"~").replace(/[‘’]/g,"'")
      .replace(/[“”]/g,'"').replace(/±/g,"+/-").replace(/→/g,"->")
      .replace(/[^\x20-\x7E]/g,"");
  }
  function esc(v){ return ascii(v).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  function f2(n){ return (Math.round(n*100)/100).toString(); }

  function Sheet(){
    this.ops = [];
    this.H = 792;
  }
  Sheet.prototype.rect = function(x,yTop,w,h,c){
    this.ops.push(c.join(" ")+" rg", f2(x)+" "+f2(this.H-yTop-h)+" "+f2(w)+" "+f2(h)+" re f");
  };
  Sheet.prototype.text = function(x,yTop,size,bold,c,str,track){
    this.ops.push("BT", c.join(" ")+" rg", "/"+(bold?"F2":"F1")+" "+f2(size)+" Tf",
      f2(track||0)+" Tc", f2(x)+" "+f2(this.H-yTop)+" Td", "("+esc(str)+") Tj", "ET");
  };
  Sheet.prototype.right = function(xRight,yTop,size,bold,c,str,track){
    var w = this.width(str,size,bold,track||0);
    this.text(xRight-w, yTop, size, bold, c, str, track);
  };
  /* Helvetica advance widths, /1000 em — enough for right-aligning short strings. */
  var WIDTHS = {" ":278,"!":278,'"':355,"#":556,"$":556,"%":889,"&":667,"'":191,"(":333,")":333,
    "*":389,"+":584,",":278,"-":333,".":278,"/":278,"0":556,"1":556,"2":556,"3":556,"4":556,
    "5":556,"6":556,"7":556,"8":556,"9":556,":":278,";":278,"<":584,"=":584,">":584,"?":556,
    "@":1015,"A":667,"B":667,"C":722,"D":722,"E":667,"F":611,"G":778,"H":722,"I":278,"J":500,
    "K":667,"L":556,"M":833,"N":722,"O":778,"P":667,"Q":778,"R":722,"S":667,"T":611,"U":722,
    "V":667,"W":944,"X":667,"Y":667,"Z":611,"[":278,"\\":278,"]":278,"^":469,"_":556,"`":333,
    "a":556,"b":556,"c":500,"d":556,"e":556,"f":278,"g":556,"h":556,"i":222,"j":222,"k":500,
    "l":222,"m":833,"n":556,"o":556,"p":556,"q":556,"r":333,"s":500,"t":278,"u":556,"v":500,
    "w":722,"x":500,"y":500,"z":500,"{":334,"|":260,"}":334,"~":584};
  var BOLD_EXTRA = 1.055;
  Sheet.prototype.width = function(str,size,bold,track){
    var t = ascii(str), w = 0;
    for(var i=0;i<t.length;i++){ w += (WIDTHS[t[i]] || 556); }
    w = w/1000*size*(bold?BOLD_EXTRA:1);
    return w + (track||0)*t.length;
  };
  Sheet.prototype.build = function(){
    var stream = this.ops.join("\n");
    var objs = [null,
      "<< /Type /Catalog /Pages 2 0 R >>",
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>",
      "<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
    var out = "%PDF-1.4\n", offs = [];
    for(var i=1;i<objs.length;i++){ offs[i] = out.length; out += i+" 0 obj\n"+objs[i]+"\nendobj\n"; }
    var xref = out.length;
    out += "xref\n0 "+objs.length+"\n0000000000 65535 f \n";
    for(i=1;i<objs.length;i++){ out += ("0000000000"+offs[i]).slice(-10)+" 00000 n \n"; }
    out += "trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
    return out;
  };

  function heightLabel(){
    if(S.units === "metric") return Math.round(S.heightIn*2.54) + " cm";
    return Math.floor(S.heightIn/12) + " ft " + Math.round(S.heightIn%12) + " in";
  }
  function weightLabel(){
    if(S.units === "metric") return (Math.round(S.weightLb/LB_PER_KG*10)/10) + " kg";
    return Math.round(S.weightLb) + " lb";
  }
  function rateLabel(){
    for(var i=0;i<RATES.length;i++){ if(RATES[i].v === S.rate) return RATES[i].label; }
    return one(S.rate) + " lb/wk";
  }
  function actLabel(){
    for(var i=0;i<ACTIVITY.length;i++){ if(ACTIVITY[i].v === S.act) return ACTIVITY[i].label + " (x" + S.act + ")"; }
    return "x" + S.act;
  }

  function buildPdf(){
    var r = compute(), gaining = r.rate < 0;
    var carbG = Math.max(0, r.carbG), carbK = Math.max(0, r.carbK);
    var d = new Date();
    var stamp = d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
    var M = 54, RM = 558, p = new Sheet(), y;

    /* masthead */
    p.rect(0,0,612,92,NAVY);
    p.text(M,34,7.5,true,[0.58,0.63,0.74],"STARFIGHTER FITNESS - NUTRITION DESK",1.6);
    p.text(M,68,27,true,PAPER,"STARFIGHTER MACROS",-0.5);
    p.rect(0,92,612,4,RED);

    p.right(RM,34,7.5,false,[0.58,0.63,0.74],"SAVED "+stamp.toUpperCase(),1.2);

    /* the headline number */
    y = 136;
    p.text(M,y,8,true,GREY,"DAILY INTAKE TARGET",1.8);
    p.text(M,y+44,44,true,NAVY,num(r.target),-1.2);
    p.text(M+p.width(num(r.target),44,true,-1.2)+9,y+44,11,true,GREY,"KCAL",1.2);

    /* two columns: inputs | energy */
    var colY = y+72, L = M, R = 320;
    p.rect(L,colY,240,1.2,HAIR); p.rect(R,colY,238,1.2,HAIR);
    p.text(L,colY+16,8,true,NAVY,"INPUTS",1.6);
    p.text(R,colY+16,8,true,NAVY,"ENERGY",1.6);

    var rows = [
      [L, [["Sex", S.sex === "male" ? "Male" : "Female"],
           ["Age", S.age + " years"],
           ["Height", heightLabel()],
           ["Weight", weightLabel()],
           ["Activity", actLabel()],
           ["Rate", rateLabel()],
           ["Protein setting", one(r.ppl) + " g/lb"],
           ["Fat share", Math.round(r.fatP*100) + "% of intake"]]],
      [R, [["BMR (Mifflin-St Jeor)", num(r.bmr) + " kcal"],
           ["TDEE", num(r.tdee) + " kcal"],
           [r.adjust === 0 ? "Adjustment" : (gaining ? "Surplus" : "Deficit"),
            (r.adjust === 0 ? "0" : (gaining ? "+" : "-") + num(Math.abs(r.adjust))) + " kcal"],
           ["Intake target", num(r.target) + " kcal"]]]
    ];
    rows.forEach(function(col){
      var x = col[0], ry = colY + 34;
      col[1].forEach(function(row){
        p.text(x,ry,9,false,GREY,row[0]);
        p.right(x + (x === L ? 240 : 238), ry, 9, true, NAVY, row[1]);
        p.rect(x, ry+6, x === L ? 240 : 238, 0.5, HAIR);
        ry += 19;
      });
    });

    /* macro table */
    y = colY + 34 + 8*19 + 16;
    p.rect(M,y,504,1.2,HAIR);
    p.text(M,y+16,8,true,NAVY,"THE SPLIT",1.6);
    var macros = [
      ["PROTEIN", one(r.ppl)+" g/lb of bodyweight", r.proG, r.proK, C_PRO],
      ["FAT",     Math.round(r.fatP*100)+"% of intake", r.fatG, r.fatK, C_FAT],
      ["CARBS",   "the remainder",                  carbG,  carbK,  C_CARB]
    ];
    var my = y + 38, tot = r.target > 0 ? r.target : 1;
    macros.forEach(function(m){
      p.rect(M,my-7,9,9,m[4]);
      p.text(M+17,my,12,true,NAVY,m[0],0.3);
      p.text(M+17+p.width(m[0],12,true,0.3)+13,my,8,false,GREY,m[1]);
      p.right(RM-120,my,14,true,NAVY,num(m[2])+" g",-0.3);
      p.right(RM,my,9,false,GREY,num(m[3])+" kcal   "+Math.round(m[3]/tot*100)+"%");
      p.rect(M,my+9,504,0.5,HAIR);
      my += 26;
    });

    /* stacked bar */
    var sum = r.proK + r.fatK + carbK; if(sum <= 0) sum = 1;
    var bx = M, bw = 504, bh = 9, by = my - 2;
    [[r.proK,C_PRO],[r.fatK,C_FAT],[carbK,C_CARB]].forEach(function(seg){
      var w = seg[0]/sum*bw;
      p.rect(bx,by,w,bh,seg[1]);
      bx += w;
    });

    /* arithmetic */
    y = by + 30;
    p.rect(M,y,504,1.2,HAIR);
    p.text(M,y+16,8,true,NAVY,"THE ARITHMETIC",1.6);
    var sexTerm = S.sex === "male" ? "+ 5" : "- 161";
    var lines = [
      "BMR   = (10 x "+one(r.kg)+" kg) + (6.25 x "+one(r.cm)+" cm) - (5 x "+S.age+") "+sexTerm+" = "+num(r.bmr)+" kcal",
      "TDEE  = "+num(r.bmr)+" x "+r.act+" = "+num(r.tdee)+" kcal",
      (r.adjust === 0 ? "Adjustment = none" :
        (gaining?"Surplus":"Deficit")+" = ("+one(Math.abs(r.rate))+" lb/wk x 3,500) / 7 = "+num(Math.abs(r.adjust))+" kcal/day"),
      "Target = "+num(r.tdee)+(r.adjust === 0 ? "" : (gaining?" + ":" - ")+num(Math.abs(r.adjust)))+" = "+num(r.target)+" kcal",
      "Protein = "+num(S.weightLb)+" lb x "+one(r.ppl)+" = "+num(r.proG)+" g  ("+num(r.proK)+" kcal)",
      "Fat     = ("+num(r.target)+" x "+r.fatP.toFixed(2)+") / 9 = "+num(r.fatG)+" g  ("+num(r.fatK)+" kcal)",
      "Carbs   = ("+num(r.target)+" - "+num(r.proK)+" - "+num(r.fatK)+") / 4 = "+num(carbG)+" g"
    ];
    var ly = y + 36;
    lines.forEach(function(t){ p.text(M,ly,8.5,false,[0.25,0.29,0.38],t); ly += 14; });

    /* notes — a coach's sheet gets room to write on */
    y = ly + 14;
    p.rect(M,y,504,1.2,HAIR);
    p.text(M,y+16,8,true,NAVY,"NOTES",1.6);
    p.text(M+52,y+16,7.5,false,GREY,"weight trend, waist, training quality, appetite");
    var ny = y + 38;
    for(var k=0;k<5;k++){ p.rect(M,ny,504,0.5,HAIR); ny += 20; }

    /* footer */
    var fy = 742;
    p.rect(M,fy-16,504,1.2,NAVY);
    p.text(M,fy,7,false,GREY,"Mifflin MD, St Jeor ST, Hill LA, Scott BJ, Daugherty SA, Koh YO. Am J Clin Nutr 1990;51(2):241-247. Population-level equation:");
    p.text(M,fy+11,7,false,GREY,"individual resting metabolic rate varies roughly +/-10-15% from its prediction. Planning estimate for training and nutrition, not medical advice.");
    p.right(RM,fy+24,7,true,GREY,"STARFIGHTER FITNESS",1.2);
    p.text(M,fy+24,7,true,GREY,"RECHECK EVERY TWO TO THREE WEEKS",1.2);

    return p.build();
  }

  function pdfName(){
    var d = new Date(), pad = function(n){ return (n<10?"0":"")+n; };
    return "Starfighter-Macros_" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".pdf";
  }

  function noteSave(text, warn){
    var n = $("saveNote");
    n.textContent = text || "";
    n.className = warn ? "save-note warn" : "save-note";
    n.hidden = !text;
  }
  function wireSave(){
    $("saveBtn").addEventListener("click", function(){
      var btn = $("saveBtn");
      btn.disabled = true; btn.textContent = "Building…"; noteSave("");
      var blob;
      try{
        blob = new Blob([buildPdf()], {type:"application/pdf"});
      }catch(e){
        btn.disabled = false; btn.textContent = "Save these numbers as PDF";
        noteSave("Could not build the file.", true); return;
      }
      try{
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = pdfName(); a.style.display = "none";
        document.body.appendChild(a); a.click();
        setTimeout(function(){
          if(a.parentNode) a.parentNode.removeChild(a);
          URL.revokeObjectURL(url);
        }, 3000);
        btn.textContent = "Saved"; noteSave("");
        setTimeout(function(){ btn.textContent = "Save these numbers as PDF"; btn.disabled = false; }, 2200);
      }catch(e){
        btn.textContent = "Save these numbers as PDF"; btn.disabled = false;
        noteSave("The download did not start. Try another browser.", true);
      }
    });
  }
  function loadDownloads(){ $("saveWrap").hidden = false; }

  /* ---------- persistence ---------- */
  var KEY = "starfighter-macros-v1";
  var saveTimer = null;

  function snapshot(){
    return {units:S.units, sex:S.sex, age:S.age, weightLb:S.weightLb,
            heightIn:S.heightIn, act:S.act, rate:S.rate, ppl:S.ppl,
            fatPct:S.fatPct, touched:S.touched};
  }
  function apply(d){
    if(!d || typeof d !== "object") return;
    if(d.units === "metric" || d.units === "imperial") S.units = d.units;
    if(d.sex === "male" || d.sex === "female") S.sex = d.sex;
    ["age","weightLb","heightIn","act","rate","ppl","fatPct"].forEach(function(k){
      if(typeof d[k] === "number" && isFinite(d[k])) S[k] = d[k];
    });
    if(d.touched) S.touched = true;
  }
  function loadLocal(){
    try{
      var raw = window.localStorage.getItem(KEY);
      if(raw) apply(JSON.parse(raw));
    }catch(e){}
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var data = snapshot();
      try{ window.localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    }, 500);
  }
  function loadRemote(){}

  var FONT_HREF = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap";
  function ensureFont(){
    try{
      if(document.querySelector('link[data-sfm-font]')) return;
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.href = FONT_HREF; l.setAttribute("data-sfm-font","1");
      (document.head || document.documentElement).appendChild(l);
    }catch(e){}
  }

  /* The page builder hands this element a fixed-width column. Measure how far
     it sits from each edge of the document and pull the calculator out by
     exactly that much, so the navy bars span the window. documentElement
     .clientWidth excludes the scrollbar, which 100vw does not -- using it is
     what keeps this from creating a horizontal scrollbar of its own. */
  var bleedTimer = null;
  function syncBleed(){
    try{
      var host = document.getElementById("starfighter-macros");
      if(!host) return;
      var r = host.getBoundingClientRect();
      var docW = document.documentElement.clientWidth;
      host.style.setProperty("--sfm-bleed-l", (-Math.max(0, Math.round(r.left))) + "px");
      host.style.setProperty("--sfm-bleed-r", (-Math.max(0, Math.round(docW - r.right))) + "px");
    }catch(e){}
  }
  function watchBleed(){
    syncBleed();
    try{
      window.addEventListener("resize", function(){
        clearTimeout(bleedTimer);
        bleedTimer = setTimeout(syncBleed, 120);
      });
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(syncBleed)["catch"](function(){}); }
      setTimeout(syncBleed, 400);
      setTimeout(syncBleed, 1500);
    }catch(e){}
  }

  function mount(){
    ensureFont();
    var host = document.getElementById("starfighter-macros");
    if(!host || host.shadowRoot) return;
    ROOT = host.attachShadow({mode:"open"});
    ROOT.innerHTML = '<style>@import url("' + FONT_HREF + '");</style>' +
                     "<style>" + SFM_CSS + "</style>" + SFM_HTML;
    init();
    watchBleed();
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", mount);
  } else { mount(); }
})();
</script>
